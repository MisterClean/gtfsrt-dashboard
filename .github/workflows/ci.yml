name: Check browser dashboard

on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'svelte.config.js'
      - 'scripts/**'
      - 'tests/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'package*.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main, 'codex/**', 'feature/**']
    paths:
      - 'src/**'
      - 'crates/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'svelte.config.js'
      - 'scripts/**'
      - 'tests/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'package*.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            target
            .cache/duckdb-extensions
          key: dashboard-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock', 'package-lock.json', 'scripts/extensions.mjs') }}
      - run: npm ci --ignore-scripts
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p transit-core --all-targets -- -D warnings
      - run: cargo clippy --locked -p transit-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked -p transit-core
      - run: npm test
      - name: Install matching WASM bindings tool
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.105'; then
            cargo install wasm-bindgen-cli --version 0.2.105 --locked
          fi
      - run: npm run build:wasm
      - run: npm run check
      - run: npm run build
      - run: npm run verify:release

name: Refresh feed health

# Probes the public archive weekly and opens a pull request when public/feed-health.json
# changes, so every status change is reviewed by a person before it ships. The job only
# publishes a static file; on-device analysis stays the default and the check on it.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/validate-feeds.mjs
      - name: Open or update the pull request if a status, size class or note changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The file has no timestamps and rounds sizes to 10 MB, so any diff is a real change.
          if git diff --quiet -- public/feed-health.json; then
            echo "No feed health changes."
            exit 0
          fi
          branch="chore/feed-health"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/feed-health.json
          git commit -m "Refresh feed health"
          git push --force origin "$branch"
          body="Generated by scripts/validate-feeds.mjs, checked $(date -u +%Y-%m-%dT%H:%MZ). Review each status change; hand-edited notes live in src/data/feed-overrides.json."
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --title "Refresh feed health" --base "${GITHUB_REF_NAME}" --head "$branch" --body "$body"
          fi

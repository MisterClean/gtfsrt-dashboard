name: Refresh feed health

# Probes the public archive weekly and opens a pull request when public/feed-health.json
# changes, so every status change is reviewed by a person before it ships. The job only
# publishes a static file; on-device analysis stays the default and the check on it.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-feeds.mjs
      - name: Open a pull request if anything but the timestamp changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # checked_at changes every run. Only a real status, date or size change is worth a review.
          if git diff --quiet -I'"checked_at"' -- public/feed-health.json; then
            echo "No feed health changes."
            exit 0
          fi
          branch="chore/feed-health-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/feed-health.json
          git commit -m "Refresh feed health"
          git push origin "$branch"
          gh pr create --title "Refresh feed health" --base "${GITHUB_REF_NAME}" --head "$branch" \
            --body "Generated by scripts/validate-feeds.mjs. Review each status change; hand-edited notes live in src/data/feed-overrides.json."

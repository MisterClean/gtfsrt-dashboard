[package]
name = "transit-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Transit performance analytics: map-matching, stop events and additive service-day rollups"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
csv = "1.3"

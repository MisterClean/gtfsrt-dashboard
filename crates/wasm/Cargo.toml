[package]
name = "transit-wasm"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Browser bindings for transit-core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
transit-core = { path = "../core" }
serde = "1.0.228"
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.105"
js-sys = "=0.3.82"
console_error_panic_hook = "0.1.7"

[workspace]
members = [".", "crates/core", "crates/wasm"]
resolver = "3"

[package]
name = "gtfsrt-dashboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A browser-local GTFS-RT archive explorer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.12", features = ["csr"] }
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "=0.4.55"
js-sys = "=0.3.82"
web-sys = { version = "=0.3.82", features = ["Window", "Document", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Location", "UrlSearchParams"] }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
